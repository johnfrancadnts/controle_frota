<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frota de Carros</title>
<style>
:root{--bg:#f3f8f1;--card:#fff;--text:#17233a;--muted:#647086;--line:#dce6dc;--blue:#10389e;--blue2:#082d89;--red:#d94343;--green:#63df18;--orange:#d99a19;--shadow:0 8px 26px rgba(16,56,158,.08);--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #d9e6d7;display:flex;justify-content:space-between;align-items:center;padding:13px 22px}
.brand{font-weight:900;letter-spacing:.14em;font-size:13px}.brand span{color:var(--blue)}
.nav{display:flex;gap:8px}.btn{border:1px solid #c8d9e5;background:#fff;color:var(--blue);border-radius:8px;padding:9px 13px;font-size:11px;font-weight:800}.btn:hover{background:#eff8ea}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--red);border-color:#efb1ad}.btn.dark{color:var(--text);border-color:var(--line)}
.wrap{max-width:1320px;margin:auto;padding:22px}
.header{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:14px}.kicker{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.15em;text-transform:uppercase}.title{font-size:27px;font-weight:900;margin:2px 0}.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}.head{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:0}.body{padding:16px}
.calendar-bar{display:flex;align-items:center;justify-content:space-between}.month{font-size:16px;font-weight:900;text-transform:capitalize}.navmonth{display:flex;gap:5px}.cal-scroll{overflow:auto}.calendar{min-width:720px;display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:11px;overflow:hidden}.wd{background:#f8fbf6;padding:9px 8px;text-align:center;color:var(--muted);font-size:10px;font-weight:900;border-right:1px solid var(--line)}.day{min-height:118px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:7px}.day.muted{background:#f8fbf6}.num{font-size:11px;font-weight:900;margin-bottom:5px}.today .num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;background:var(--blue);color:white;border-radius:50%}
.event{display:flex;align-items:center;border:1px solid #dfeaf2;background:#f4f9fd;padding:7px 8px;border-radius:8px;margin:4px 0;cursor:pointer}.eventtext{min-width:0}.event .time{font-size:9px;font-weight:900;color:var(--blue)}.event .label{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.open{background:#fff7e9;border-color:#f0dfb9}.event.done{background:#eef7f0;border-color:#d5e9da}
.simple-table{width:100%;border-collapse:collapse}.simple-table th,.simple-table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left}.simple-table th{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);background:#f8fbf6}.simple-table td{font-size:12px}.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:900}.b-gray{background:#f0f5ee;color:#59656e}.b-blue{background:#eaf0ff;color:#123eae}.b-orange{background:#fff4d9;color:#9a6a00}.b-green{background:#eaf9e4;color:#3e8c22}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cfd9df;border-radius:8px;outline:none;background:#fff}.field textarea{min-height:74px;resize:vertical}.wide{grid-column:1/-1}
.empty{text-align:center;padding:25px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(13,24,33,.45);z-index:60;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:100%;max-width:700px;max-height:90vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 30px 100px rgba(0,0,0,.25)}.mh{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mb{padding:17px}.mf{padding:13px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px}.tab{border:0;background:transparent;padding:11px 8px;font-size:10px;font-weight:900;color:var(--muted)}.tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}
.carrow{display:flex;align-items:center;gap:9px}.carrow img{width:48px;height:30px;object-fit:contain}.tiny{font-size:10px;color:var(--muted)}.notice{padding:10px 12px;background:#eff8ea;color:#244f7e;border-radius:8px;font-size:12px;margin-bottom:12px}
.dangertext{color:var(--red);font-size:11px;font-weight:700;margin-top:7px;min-height:14px}
@media(max-width:700px){.top{padding:11px 13px;align-items:flex-start}.nav{flex-wrap:wrap;justify-content:flex-end}.wrap{padding:13px}.header{display:block}.header .actions{margin-top:11px}.title{font-size:23px}.body{padding:12px}.calendar{min-width:675px}.day{min-height:102px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.simple-table{min-width:680px}.table-scroll{overflow:auto}.head{align-items:flex-start;flex-wrap:wrap}}

.btn{transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px rgba(20,118,190,.12)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary:hover{box-shadow:0 7px 18px rgba(22,118,190,.22)}
.event{transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.event:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(20,33,45,.08)}


.car-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.car-choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;background .16s ease}
.car-choice:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,33,45,.08);border-color:#9eb6e8}
.car-choice .num{font-size:10px;color:var(--blue);letter-spacing:.1em;margin:0 0 6px}
.car-choice .name{font-size:16px;font-weight:900}
.car-choice .meta{font-size:11px;color:var(--muted);margin-top:4px}
.slot-free,.slot-busy{display:inline-block;margin-top:9px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.slot-free{color:var(--green)}.slot-busy{color:var(--orange)}
@media(max-width:900px){.car-selector{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.car-selector{grid-template-columns:1fr}}

/* PDF / impressão */
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff!important}
  body > *:not(#pdfReport){display:none!important}
  #pdfReport{display:block!important;position:static!important}
}
#pdfReport{display:none}
.pdf-report{color:#18232d;font-family:Arial,Helvetica,sans-serif}
.pdf-title{font-size:20px;font-weight:800;margin:0 0 3px}
.pdf-subtitle{font-size:11px;color:#66717d;margin-bottom:14px}
.pdf-meta{display:flex;justify-content:space-between;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:7px 0;margin-bottom:12px;font-size:10px}
.pdf-table{width:100%;border-collapse:collapse;font-size:9px}
.pdf-table th{background:#f2f4f6;text-align:left;padding:7px 6px;border:1px solid #d8dde1;font-size:8px;text-transform:uppercase}
.pdf-table td{padding:6px;border:1px solid #d8dde1;vertical-align:top}
.pdf-foot{margin-top:12px;font-size:9px;color:#66717d}
@media screen{#pdfReport{display:none!important}}


/* Painel CONTROLE — estilo administrativo compacto */
.admin-mode{padding:0;background:#f0f5ee;align-items:stretch;justify-content:stretch}
.admin-mode .box.admin-box{width:100%;max-width:none;height:100vh;max-height:none;border-radius:0;box-shadow:none;background:#f0f5ee;display:flex;flex-direction:column}
.admin-box .mh{background:#102b40;color:#fff;border-bottom:2px solid #2d8ad0;padding:10px 18px;min-height:52px}
.admin-box .mh strong{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.admin-box .mh .btn{border-color:#41627a;background:transparent;color:#fff;padding:7px 11px}
.admin-box .mh .btn:hover{background:#1644ac}
.admin-box .mb{padding:0;overflow:auto;flex:1}
.admin-box .mf{background:#f0f5ee;border-top:1px solid #ccd6dd;padding:8px 18px}
.admin-box .tabs{background:#fbfdf9;padding:0 18px;border-bottom:1px solid #c8d2d9}
.admin-box .tab{font-size:10px;padding:11px 12px}
.admin-box .admin-content-wrap{padding:15px 18px 20px}
.admin-titleline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:9px}
.admin-section-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:#20313f}
.admin-panel{background:#fff;border:1px solid #cbd5db;box-shadow:0 3px 12px rgba(20,35,45,.07);margin-bottom:15px}
.admin-panel-head{padding:9px 10px;border-bottom:1px solid #cbd5db;background:#fbfdf9;font-size:11px;font-weight:900;letter-spacing:.05em}
.admin-panel-body{padding:10px}
.admin-form-row{display:grid;grid-template-columns:minmax(220px,1.8fr) minmax(120px,.7fr) minmax(130px,.8fr) 110px auto;gap:7px}
.admin-form-row .field{margin:0}
.admin-form-row .field label{display:none}
.admin-box .field input,.admin-box .field select,.admin-box .field textarea{padding:8px 9px;border-radius:0;border-color:#c8d3da;font-size:12px}
.admin-box .btn{border-radius:0;font-size:10px;letter-spacing:.04em;padding:8px 11px}
.admin-box .simple-table th{background:#f7faf6;border-color:#cbd5db;padding:8px;font-size:8px}
.admin-box .simple-table td{border-color:#ccd5da;padding:8px;font-size:11px}
.admin-box .simple-table tbody tr:nth-child(even){background:#f5faef}
.admin-box .simple-table tbody tr:nth-child(odd){background:#fff}
.admin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.admin-help{font-size:10px;color:#65727c;margin-top:6px}
@media(max-width:800px){
  .admin-form-row{grid-template-columns:1fr 1fr}
  .admin-form-row .wide-mobile{grid-column:1/-1}
  .admin-grid2{grid-template-columns:1fr}
}
@media(max-width:520px){
  .admin-form-row{grid-template-columns:1fr}
  .admin-form-row .wide-mobile{grid-column:auto}
  .admin-box .tabs{overflow:auto}
  .admin-box .tab{white-space:nowrap}
}


.home{padding-top:18px}
.hero-showcase{position:relative;min-height:650px;border:1px solid #d9e1e6;border-radius:18px;overflow:hidden;background:#f7fbf4;box-shadow:0 16px 45px rgba(20,33,45,.08)}
.hero-accent{position:absolute;right:20%;top:0;width:235px;height:100%;background:linear-gradient(180deg,#163e65,#0c78a6)}
.hero-inner{position:relative;z-index:2;min-height:650px;display:grid;grid-template-columns:42% 58%;align-items:center;padding:52px 55px}
.hero-copy{position:relative;z-index:3;padding-left:8px}.hero-copy .kicker{letter-spacing:.23em}
.hero-number{font-size:12px;letter-spacing:.25em;font-weight:900;color:var(--blue);margin-top:20px}
.hero-copy h1{font-size:54px;line-height:1;margin:5px 0 14px;font-weight:900;letter-spacing:-.045em}
.hero-copy p{max-width:360px;color:#606d77;font-size:14px;line-height:1.55;margin-bottom:22px}
.hero-info{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px}.hero-info span{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#4d5962}
#heroStatus{color:var(--green)}
.hero-cta{border:0;border-radius:9px;padding:12px 18px;background:#132d41;color:#fff;font-size:11px;font-weight:900;letter-spacing:.09em;box-shadow:0 8px 20px rgba(20,44,62,.18);transition:.18s ease}
.hero-cta:hover{transform:translateY(-2px);background:#1a4665;box-shadow:0 12px 26px rgba(20,44,62,.24)}.hero-cta:active{transform:scale(.98)}
.hero-car-stage{position:relative;height:500px;display:flex;align-items:center;justify-content:center}
.hero-car-stage img{position:relative;z-index:2;width:min(760px,100%);max-height:500px;object-fit:contain;filter:drop-shadow(0 25px 24px rgba(0,0,0,.16));transition:transform .25s ease,opacity .18s ease}
.hero-car-stage img.swap{opacity:0;transform:translateX(28px) scale(.985)}
.hero-dots{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}.hero-dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.55}.hero-dot.active{width:24px;border-radius:8px;opacity:1}
.hero-arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:43px;height:43px;border:1px solid #d6dee4;background:rgba(255,255,255,.92);border-radius:50%;font-size:25px;color:#18364d;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.09);transition:.16s ease}
.hero-arrow:hover{transform:translateY(-50%) scale(1.06);background:#fff}.hero-arrow.left{left:18px}.hero-arrow.right{right:18px}
.car-strip{display:flex;align-items:center;gap:11px;margin:13px 0 16px;overflow:auto;padding:3px 2px}.strip-label{font-size:10px;font-weight:900;letter-spacing:.16em;color:#71808b}
.car-mini-list{display:flex;gap:7px}.car-mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-size:10px;font-weight:900;color:#44525c;white-space:nowrap;transition:.16s ease}.car-mini:hover{transform:translateY(-1px);border-color:#abc9df}.car-mini.active{background:#eef2ff;border-color:#8fb5ee;color:#10389e}
@media(max-width:900px){.hero-accent{right:0;width:35%}.hero-inner{grid-template-columns:1fr;min-height:700px;padding:40px 28px 30px}.hero-copy h1{font-size:42px}.hero-car-stage{height:330px}.hero-car-stage img{max-height:320px}}
@media(max-width:600px){.hero-showcase,.hero-inner{min-height:630px}.hero-inner{padding:28px 18px}.hero-accent{width:43%}.hero-copy h1{font-size:36px}.hero-car-stage{height:265px}.hero-car-stage img{max-height:255px}.hero-arrow{width:37px;height:37px;font-size:21px}.hero-arrow.left{left:8px}.hero-arrow.right{right:8px}}


.home-hidden .hero-showcase,.home-hidden .car-strip{display:none}
.home-hidden .wrap{padding-top:14px}
.hero-topbar{display:none}
.photo-field{display:flex;align-items:center;gap:10px}.photo-preview{width:120px;height:70px;border:1px solid #d4dde3;border-radius:8px;object-fit:contain;background:#f3f5f7}
.photo-note{font-size:10px;color:var(--muted)}
.upload-input{padding:7px!important}
@media(max-width:600px){.hero-inner{grid-template-columns:1fr}.hero-copy{text-align:left}.hero-car-stage{margin-top:-5px}.hero-arrow.left{left:4px}.hero-arrow.right{right:4px}.photo-field{align-items:flex-start;flex-direction:column}}


html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}
.hero-showcase,.hero-inner,.hero-copy,.hero-car-stage,.card,.body,.head{min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:760px){
  .top{position:sticky}
  .nav .btn{padding:8px 10px;font-size:10px}
  .home{padding:10px}
  .hero-showcase{min-height:auto}
  .hero-inner{grid-template-columns:1fr;min-height:auto;padding:28px 18px 16px}
  .hero-copy{padding-left:0;text-align:center}
  .hero-copy p{margin-left:auto;margin-right:auto}
  .hero-info{justify-content:center}
  .hero-cta{width:100%;max-width:290px}
  .hero-accent{right:0;top:auto;bottom:0;width:100%;height:36%;opacity:.22}
  .hero-car-stage{height:260px;order:-1;margin-bottom:4px}
  .hero-car-stage img{width:100%;height:250px;object-fit:contain}
  .hero-arrow{top:48%;width:36px;height:36px}
  .hero-arrow.left{left:6px}.hero-arrow.right{right:6px}
  .car-strip{margin:10px 0 12px}
  .car-mini-list{overflow:auto;padding-bottom:3px}
  .simple-table{min-width:720px}
  .table-scroll{-webkit-overflow-scrolling:touch}
  .modal{padding:8px}
  .box{max-height:94vh}
  .admin-box .admin-content-wrap{padding:12px}
}
@media(max-width:430px){
  .brand{font-size:11px}.nav{gap:4px}
  .hero-copy h1{font-size:31px}
  .hero-number{margin-top:4px}
  .hero-car-stage{height:220px}.hero-car-stage img{height:215px}
  .hero-info{gap:9px}
}


/* Paleta institucional */
body{background:var(--bg);color:var(--text)}
.top{background:var(--blue);border-bottom-color:#0b2f87;color:#fff}
.brand{color:#fff}.brand span{color:var(--green)}
.nav .btn{border-color:rgba(255,255,255,.28);background:transparent;color:#fff}

.nav .btn.primary{background:var(--green);border-color:var(--green);color:#10317e}
.header .kicker,.hero-copy .kicker{color:var(--blue)}
.title,.hero-copy h1{color:var(--blue)}
.hero-showcase{background:#fff;border-color:#d5e3d1;box-shadow:0 16px 45px rgba(16,56,158,.10)}

.hero-arrow:hover{background:#f5f8ff;border-color:#a7bce6;color:var(--blue2)}
.hero-dot.active{background:var(--green)}
.hero-dot{background:#dce5ef}
.car-mini.active{background:#eef2ff;border-color:#97ade2;color:var(--blue)}
.btn.primary{box-shadow:0 7px 18px rgba(16,56,158,.18)}
.btn.primary:hover{box-shadow:0 10px 22px rgba(16,56,158,.25)}
.slot-free,.b-green{color:#3e8d1f}

.event{background:#f1f5ff;border-color:#d5def2}
.event.open{background:#fff6df;border-color:#ecdcae}.event.pending{background:#fff9e8;border-color:#f1df9f}.event-status.pending{color:#9a6a00}

.tabs .tab.active{color:var(--blue);border-bottom-color:var(--green)}
.admin-box .mh{background:var(--blue);border-bottom-color:var(--green)}

.admin-box .btn.primary{background:var(--green);border-color:var(--green);color:#11327e}
.admin-section-title{color:var(--blue)}

<body>
<header class="top">
  <div class="brand">CONTROLE DE FROTA</div>
  <nav class="nav">
    <button class="btn primary" onclick="openSelectedCarCalendar()">+ AGENDAR</button>
    <button class="btn" onclick="openAdmin()">CONTROLE</button>
  </nav>
</header>

<main class="wrap home">
  <section class="hero-showcase">
    <div class="hero-accent"></div>
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="kicker">CONTROLE DE FROTA</div>
        <div class="hero-number" id="heroNumber">01</div>
        <h1 id="heroName">CARRO</h1>
        <p>Escolha um veículo e consulte os horários disponíveis para agendar sua retirada.</p>
        <div class="hero-info">
          <span id="heroPlate">—</span>
          <span id="heroSeats">— LUGARES</span>
          <span id="heroStatus">LIVRE</span>
        </div>
        <button class="hero-cta" onclick="openSelectedCarCalendar()">AGENDAR</button>
      </div>
      <div class="hero-car-stage">
        <img id="heroCarImage" alt="Veículo da frota">
        <div class="hero-dots" id="heroDots"></div>
      </div>
      <button class="hero-arrow left" aria-label="Carro anterior" onclick="carSlide(-1)">‹</button>
      <button class="hero-arrow right" aria-label="Próximo carro" onclick="carSlide(1)">›</button>
    </div>
  </section>
  <section class="car-strip">
    <div class="strip-label">FROTA</div><div id="carMiniList" class="car-mini-list"></div>
  </section>

function normalizeData(raw){
  raw=raw||{};
  return {
    cars:Array.isArray(raw.cars)?raw.cars.map((c,i)=>({...c,number:c.number||i+1})):[],
    employees:Array.isArray(raw.employees)?raw.employees:[],
    bookings:Array.isArray(raw.bookings)?raw.bookings:[],
    history:Array.isArray(raw.history)?raw.history:[]
  };
}
async function readCollection(col){
  const snap=await col.get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function writeCollection(col, items){
  const existing=await col.get();
  const wanted=new Set(items.map(x=>String(x.id)));
  let ops=[];
  existing.docs.forEach(d=>{if(!wanted.has(d.id))ops.push({type:'delete',ref:d.ref})});
  items.forEach(item=>{
    const id=String(item.id||uuid());
    ops.push({type:'set',ref:col.doc(id),data:{...item,id}});
  });
  for(let i=0;i<ops.length;i+=400){
    const batch=db.batch();
    for(const op of ops.slice(i,i+400)) op.type==='delete'?batch.delete(op.ref):batch.set(op.ref,op.data);
    await batch.commit();
  }
}
async function loadData(){
  try{
    const [cars,employees,bookings,history]=await Promise.all([
      readCollection(CARS_COL),readCollection(EMP_COL),readCollection(BOOK_COL),readCollection(HIST_COL)
    ]);
    if(cars.length||employees.length||bookings.length||history.length){
      data=normalizeData({cars,employees,bookings,history});
    }else{
      // Migração única: aproveita os dados do documento antigo, se ele existir.
      let old={};
      try{const snap=await FLEET_DOC.get(); if(snap.exists) old=snap.data()||{};}catch(_e){}
      data=normalizeData(old);
      if(!data.cars.length)data.cars=[{id:uuid(),model:'ESTRADA',seats:2,plate:'A DEFINIR',number:1,photo:DEFAULT_CAR_PHOTO,photoName:'',photoType:'image/svg+xml'}];
      await save();
    }
    firebaseReady=true;
    render();
  }catch(err){
    console.error('Erro ao carregar Firebase:',err);
    alert('Não foi possível conectar ao Firebase. '+(err.code||err.message||'Verifique as regras do Firestore.'));
  }
}
function save(){
  if(!firebaseReady && !data.cars.length && !data.employees.length && !data.bookings.length && !data.history.length)
    return Promise.reject(new Error('Firebase ainda não está pronto.'));
  const snapshot=normalizeData(JSON.parse(JSON.stringify(data)));
  firebaseSaving=firebaseSaving.then(async()=>{
    await Promise.all([
      writeCollection(CARS_COL,snapshot.cars),
      writeCollection(EMP_COL,snapshot.employees),
      writeCollection(BOOK_COL,snapshot.bookings),
      writeCollection(HIST_COL,snapshot.history)
    ]);
  });
  firebaseSaving.catch(err=>console.error('Erro ao salvar no Firebase:',err));
  return firebaseSaving;
}

 const start=fStart.value,end=fEnd.value,carId=fCar.value;
 if(!start||!end||new Date(end)<=new Date(start))return alert('Informe um período válido.');

 if(conflict)return alert('Esse carro já possui uma solicitação/agendamento nesse horário.');

function prepareReturnPhoto(file){
 return new Promise((resolve,reject)=>{
   if(!file)return reject(new Error('FOTO_OBRIGATORIA'));
   if(!String(file.type||'').startsWith('image/'))return reject(new Error('FORMATO_INVALIDO'));
   if(file.size>10*1024*1024)return reject(new Error('TAMANHO_INVALIDO'));
   const reader=new FileReader(); reader.onerror=()=>reject(new Error('LEITURA_INVALIDA'));
   reader.onload=()=>{const img=new Image();img.onload=()=>{

function durationStr(ms){
  const min=Math.max(0,Math.round(ms/60000)),h=Math.floor(min/60),m=min%60;
  return `${h?`${h}h `:''}${m}min`;
}
function prepareCarPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file)return resolve('');
    if(!String(file.type||'').startsWith('image/')) return reject(new Error('FORMATO_INVALIDO'));
    if(file.size>10*1024*1024)return reject(new Error('TAMANHO_INVALIDO'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('LEITURA_INVALIDA'));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=1000,maxH=700;
        const scale=Math.min(1,maxW/img.width,maxH/img.height);
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        // Mantém transparência: JPEG transforma áreas transparentes em preto.
        // WebP preserva o canal alpha e ainda comprime bastante para caber no Firestore.
        let out=canvas.toDataURL('image/webp',0.82);
        let outType='image/webp';
        // Fallback para PNG caso o navegador não suporte WebP no canvas.
        if(!out.startsWith('data:image/webp')){
          out=canvas.toDataURL('image/png');
          outType='image/png';
        }
        if(out.length>900000){
          // Reduz mais uma vez mantendo transparência.
          const maxW2=700,maxH2=500;
          const scale2=Math.min(1,maxW2/w,maxH2/h);
          const w2=Math.max(1,Math.round(w*scale2)),h2=Math.max(1,Math.round(h*scale2));
          const c2=document.createElement('canvas');c2.width=w2;c2.height=h2;
          const x2=c2.getContext('2d');x2.drawImage(img,0,0,w2,h2);
          out=c2.toDataURL('image/webp',0.78);
          outType='image/webp';
          if(!out.startsWith('data:image/webp'))out=c2.toDataURL('image/png'),outType='image/png';
        }
        if(out.length>900000)return reject(new Error('IMAGEM_GRANDE'));
        resolve({data:out,type:outType});
      };
      img.onerror=()=>reject(new Error('IMAGEM_INVALIDA'));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addCar(){
  const model=(document.getElementById('cm')?.value||'').trim();
  const plate=(document.getElementById('cp')?.value||'').trim().toUpperCase();
  const n=Number(document.getElementById('cn')?.value);
  const seats=Number(document.getElementById('cs')?.value||2);
  if(!model)return alert('Preencha o nome/modelo do carro.');
  if(!plate)return alert('Preencha a placa.');
  if(!Number.isInteger(n)||n<1||n>99)return alert('Informe um número de frota válido.');
  if(data.cars.some(c=>Number(c.number)===n))return alert('Esse número de frota já está em uso.');
  if(!firebaseReady)return alert('O Firebase ainda não terminou de carregar. Aguarde um instante e tente novamente.');

  const file=document.getElementById('cphoto')?.files?.[0];
  let photo=DEFAULT_CAR_PHOTO;
  if(file){
    try{ const prepared=await prepareCarPhoto(file); photo=prepared.data; }
    catch(e){
      if(e.message==='TAMANHO_INVALIDO')return alert('Escolha uma foto de até 10 MB.');
      if(e.message==='FORMATO_INVALIDO')return alert('Escolha uma imagem PNG, JPG, JPEG, WEBP ou GIF.');
      if(e.message==='IMAGEM_GRANDE')return alert('Essa imagem é muito grande para o banco. Escolha uma foto menor.');
      return alert('Não foi possível preparar a foto. Tente outra imagem.');
    }
  }

  const id=uuid();
  const carObj={id,model,plate,seats,number:n,photo,photoName:file?.name||'',photoType:(file?.type==='image/png'?'image/webp':'image/webp')};
  data.cars.push(carObj);
  try{
    await save();
    adminTab('cars');
    render();
  }catch(e){
    data.cars=data.cars.filter(c=>c.id!==id);
    console.error('Erro ao salvar carro:',e);
    alert('Não foi possível salvar o carro no Firebase. '+(e.code||e.message||'Verifique as regras do Firestore.'));
  }
}

    return `<tr>
      <td>${i+1}</td>
      <td><b>${String(c?.number||'').padStart(2,'0')} - ${esc(c?.model||'')}</b><br>${esc(c?.plate||'')}</td>
      <td>${esc(emp(b.actualPickupId)?.name||'—')}</td>
      <td>${dt(b.actualPickupAt||b.start)}</td>
      <td>${dt(b.actualReturnAt||b.end)}</td>
    </tr>`;
  }).join('');

  pdfReport.innerHTML=`<div class="pdf-report">
    <div class="pdf-title">CONTROLE DE FROTA - REGISTROS DE RETIRADA</div>
    <div class="pdf-subtitle">Relatório mensal de veículos efetivamente retirados</div>
    <div class="pdf-meta"><span><b>Período:</b> ${esc(monthName)}</span><span><b>Total:</b> ${rows.length} retirada(s)</span></div>
    <table class="pdf-table">
      <thead><tr><th>#</th><th>Veículo</th><th>Quem pegou</th><th>Retirada</th><th>Devolução</th></tr></thead>
      <tbody>${reportRows}</tbody>
    </table>
    <div class="pdf-foot">Documento gerado pelo sistema de controle de frota. Use "Salvar como PDF" na janela de impressão.</div>
  </div>`;

  closeModal();
  setTimeout(()=>window.print(),80);
}
function viewReturnPhoto(id){
 const b=data.bookings.find(x=>x.id===id)||data.history.find(x=>x.id===id);
 if(!b?.returnPhoto)return alert('Esta devolução não possui mais uma foto salva.');
 openModal('Foto da devolução',`<div style="display:flex;justify-content:center;align-items:center;min-height:300px;background:#f3f5f7;border-radius:12px;padding:12px"><img src="${b.returnPhoto}" alt="Foto da devolução" style="max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px"></div><div class="tiny" style="margin-top:10px;text-align:center">${esc(emp(b.actualReturnId||b.actualPickupId)?.name||'Funcionário')} • ${b.actualReturnAt?dt(b.actualReturnAt):'Data não registrada'}</div>`,`<button class="btn dark" onclick="closeModal()">FECHAR</button>`);
}
async function deleteReturnPhotos(){
 const count=data.bookings.filter(b=>b.returnPhoto).length+data.history.filter(h=>h.returnPhoto).length;
 if(!count)return alert('Não há fotos de devolução para apagar.');
 if(!confirm(`Apagar ${count} foto(s) de devolução? O histórico, nomes, datas e demais dados permanecerão intactos.`))return;
 const oldBookings=data.bookings.map(b=>({...b}));
 const oldHistory=data.history.map(h=>({...h}));
 data.bookings.forEach(b=>{delete b.returnPhoto;delete b.returnPhotoName});
 data.history.forEach(h=>{delete h.returnPhoto;delete h.returnPhotoName});
 try{await save();adminTab('hist');render();alert('Fotos de devolução apagadas. O histórico foi mantido.')}catch(e){data.bookings=oldBookings;data.history=oldHistory;console.error(e);alert('Não foi possível apagar as fotos no Firebase. '+(e.code||e.message||''))}
}
function clearCompleted(){const completed=data.bookings.filter(b=>b.status==='DEVOLVIDO');if(!completed.length)return alert('Nenhum veículo entregue para limpar.');if(confirm(`Arquivar ${completed.length} registro(s) já entregues? Agendamentos e veículos em uso permanecerão no gerenciamento.`)){data.history.push(...completed.map(b=>({...b,archivedAt:new Date().toISOString()})));data.bookings=data.bookings.filter(b=>b.status!=='DEVOLVIDO');save();adminTab('hist');render()}}
loadData();
</script>
