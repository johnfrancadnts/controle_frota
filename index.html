<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frota de Carros</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">CONTROLE DE FROTA</div>
  <nav class="nav">
    <button class="btn primary" onclick="openSelectedCarCalendar()">+ AGENDAR</button>
    <button class="btn" onclick="openAdmin()">CONTROLE</button>
  </nav>
</header>

<main class="wrap home">
  <section class="hero-showcase">
    <div class="hero-accent"></div>
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="kicker">CONTROLE DE FROTA</div>
        <div class="hero-number" id="heroNumber">01</div>
        <h1 id="heroName">CARRO</h1>
        <p>Escolha um veículo e consulte os horários disponíveis para agendar sua retirada.</p>
        <div class="hero-info">
          <span id="heroPlate">—</span>
          <span id="heroSeats">— LUGARES</span>
          <span id="heroStatus">LIVRE</span>
        </div>
        <button class="hero-cta" onclick="openSelectedCarCalendar()">AGENDAR</button>
      </div>
      <div class="hero-car-stage">
        <img id="heroCarImage" alt="Veículo da frota">
        <div class="hero-dots" id="heroDots"></div>
      </div>
      <button class="hero-arrow left" aria-label="Carro anterior" onclick="carSlide(-1)">‹</button>
      <button class="hero-arrow right" aria-label="Próximo carro" onclick="carSlide(1)">›</button>
    </div>
  </section>
  <section class="car-strip">
    <div class="strip-label">FROTA</div><div id="carMiniList" class="car-mini-list"></div>
  </section>

  <section class="card" id="selectedCalendar" style="display:none">
    <div class="head">
      <div><div class="kicker">DISPONIBILIDADE DO CARRO</div><div class="month" id="selectedCarTitle"></div></div>
      <div class="actions"><button class="btn dark" onclick="clearSelectedCar()">VOLTAR</button><button class="btn primary" onclick="openBooking()">AGENDAR</button></div>
    </div>
    <div class="body">
      <div class="calendar-bar" style="margin-bottom:12px">
        <button class="btn dark" onclick="changeMonth(-1)">‹</button><span class="month" id="monthLabel"></span><button class="btn dark" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-scroll"><div id="calendar"></div></div>
    </div>
  </section>

  <section class="card" id="pendentes">
    <div class="head"><h2>Retiradas pendentes</h2></div>
    <div class="table-scroll"><table class="simple-table"><thead><tr><th>Carro</th><th>Funcionário</th><th>Retirada</th><th>Devolução</th><th>Status</th><th></th></tr></thead><tbody id="pending"></tbody></table></div>
  </section>
</main>


<div id="pdfReport"></div>

<div class="modal" id="modal">
  <div class="box">
    <div class="mh"><strong id="modalTitle"></strong><button class="btn dark" onclick="closeModal()">FECHAR</button></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf" id="modalFoot"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body></html>
